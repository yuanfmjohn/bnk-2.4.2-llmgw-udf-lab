apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-llm
  namespace: f5-bnk-instance
spec:
  gatewayClassName: bnk-gatewayclass
  addresses:
  - type: IPAddress
    value: 10.1.200.85
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
        group: gateway.networking.k8s.io
      namespaces:
        from: Same
